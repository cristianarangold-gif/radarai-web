<header class="site-header">
  <div class="wrap header-in">
    <a class="brand" href="/" aria-label="Radar IA, inicio">Radar<span>IA</span></a>
    <a class="search-open" href="/buscar/" aria-haspopup="dialog"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="m15.5 15.5 5 5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>Buscar</a>
    <button class="theme-toggle" type="button" hidden aria-label="Activar modo oscuro" title="Activar modo oscuro"><svg class="ic-moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/></svg><svg class="ic-sun" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4.5" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M12 2v2.5M12 19.5V22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M2 12h2.5M19.5 12H22M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button>
    <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="menu-principal">Menú</button>
    <nav id="menu-principal" class="site-nav" aria-label="Principal">
      {% if start_payload %}<a class="nav-start" href="/empieza-aqui/"{% if page.url == '/empieza-aqui/' %} aria-current="page"{% endif %}>Empieza aquí</a>{% endif %}
      {% for label, href in NAV %}
      <a href="{{ href }}"{% if href == page.url %} aria-current="page"{% endif %}>{{ label }}</a>
      {% endfor %}
    </nav>
  </div>
</header>
