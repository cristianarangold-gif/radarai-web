<header class="site-header">
  <div class="wrap header-in">
    <a class="brand" href="/" aria-label="Radar IA, inicio"><span class="brand-dot" aria-hidden="true"></span>Radar<span>IA</span></a>
    <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="menu-principal">Menú</button>
    <nav id="menu-principal" class="site-nav" aria-label="Principal">
      {% for label, href in NAV %}
      <a href="{{ href }}"{% if href == page.url %} aria-current="page"{% endif %}>{{ label }}</a>
      {% endfor %}
    </nav>
  </div>
</header>
