name: Refresh Radar IA SEO index
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build sitemap and polish homepage
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('.')
          idx=root/'index.html'
          s=idx.read_text(encoding='utf-8')
          style='''\n/* Radar IA polish */\n.cta-group{display:flex;gap:14px;flex-wrap:wrap;align-items:center}\n.compare-table{width:100%;border-collapse:collapse;text-align:center;margin:18px auto}\n.compare-table th,.compare-table td{text-align:center;vertical-align:middle;padding:12px 10px}\n@media(max-width:700px){.cta-group{gap:10px}.compare-table{font-size:.92rem}}\n'''
          if '/* Radar IA polish */' not in s:
              s=s.replace('</style>',style+'</style>',1)
          idx.write_text(s,encoding='utf-8')
          urls=[]
          for p in sorted(root.rglob('index.html')):
              rel=p.relative_to(root)
              url='https://radarai.es/' if rel.as_posix()=='index.html' else 'https://radarai.es/'+rel.parent.as_posix().strip('/')+'/'
              urls.append(url)
          for p in sorted(root.glob('*.html')):
              if p.name!='index.html': urls.append('https://radarai.es/'+p.name)
          urls=sorted(set(urls))
          xml=['<?xml version="1.0" encoding="UTF-8"?>','<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">']
          xml += [f'  <url><loc>{u}</loc></url>' for u in urls]
          xml.append('</urlset>')
          (root/'sitemap.xml').write_text('\n'.join(xml)+'\n',encoding='utf-8')
          PY
      - name: Commit SEO changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sitemap.xml
          if git diff --cached --quiet; then echo "No SEO changes"; exit 0; fi
          git commit -m "Refresh sitemap and homepage polish [skip ci]"
          git pull --rebase origin main
          git push
