name: Build Radar IA public pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Repair IA catalog
        run: python3 scripts/fix_catalog.py
      - name: Remove obsolete AI sections
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          patterns = [
              r'<section\b(?:(?!</section>).)*(?:FASE\s*10\s*[·•-]\s*AUTORIDAD\s+Y\s+Y?DECISI[ÓO]N|alternativas-precios-ia|Alternativas,\s*precios\s+y\s+cambios\s+de\s+las\s+herramientas\s+IA)(?:(?!</section>).)*?</section>',
              r'<div\b(?:(?!</div>).)*(?:FASE\s*10\s*[·•-]\s*AUTORIDAD\s+Y\s+Y?DECISI[ÓO]N|alternativas-precios-ia|Alternativas,\s*precios\s+y\s+cambios\s+de\s+las\s+herramientas\s+IA)(?:(?!</div>).)*?</div>',
          ]
          removed = 0
          for pattern in patterns:
              s, n = re.subn(pattern, '', s, count=1, flags=re.I|re.S)
              removed += n
          p.write_text(s, encoding='utf-8')
          print(f'OK: secciones eliminadas={removed}')
          PY
      - name: Validate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path('index.html').read_text(encoding='utf-8')
          assert '<!DOCTYPE html>' in s
          assert '</html>' in s
          assert 'function renderCatalog(){' in s
          assert 'const cardFor=' in s
          assert 'cards[Object.keys(TOOLS).indexOf(id)]' not in s
          assert 'FASE 10' not in s.upper()
          assert 'alternativas-precios-ia' not in s
          assert 'Alternativas, precios y cambios de las herramientas IA' not in s
          print('OK: HTML completo sin secciones añadidas al final')
          PY
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Remove obsolete AI sections [skip ci]"
          git push
