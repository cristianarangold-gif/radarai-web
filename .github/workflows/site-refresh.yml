name: Build Radar IA public pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Repair IA catalog
        run: python3 scripts/fix_catalog.py
      - name: Remove only the guides section
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          pattern = re.compile(r'<section\b(?:(?!</section>).)*?RADAR\s+IA\s*[·•-]\s*GU[IÍ]AS\s+DE\s+ELECCI[ÓO]N(?:(?!</section>).)*?(?:https?://radarai\.es/mejor-ia/index\.html|/mejor-ia/index\.html)(?:(?!</section>).)*?</section>', re.I|re.S)
          s, removed = pattern.subn('', s, count=1)
          if removed == 0:
              pattern = re.compile(r'<div\b(?:(?!</div>).)*?RADAR\s+IA\s*[·•-]\s*GU[IÍ]AS\s+DE\s+ELECCI[ÓO]N(?:(?!</div>).)*?(?:https?://radarai\.es/mejor-ia/index\.html|/mejor-ia/index\.html)(?:(?!</div>).)*?</div>', re.I|re.S)
              s, removed = pattern.subn('', s, count=1)
          if removed != 1:
              raise SystemExit(f'No se eliminó exactamente una sección de Guías de Elección: {removed}')
          p.write_text(s, encoding='utf-8')
          print('OK: eliminada únicamente la sección de Guías de Elección')
          PY
      - name: Validate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path('index.html').read_text(encoding='utf-8')
          assert '<!DOCTYPE html>' in s
          assert '</html>' in s
          assert 'function renderCatalog(){' in s
          assert 'const cardFor=' in s
          assert 'cards[Object.keys(TOOLS).indexOf(id)]' not in s
          assert 'RADAR IA · GUÍAS DE ELECCIÓN' not in s
          assert 'Encuentra la mejor IA para lo que necesitas' not in s
          assert 'mejor-ia/index.html' not in s
          print('OK: HTML completo y sección eliminada')
          PY
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Remove only Radar IA guide section [skip ci]"
          git push
