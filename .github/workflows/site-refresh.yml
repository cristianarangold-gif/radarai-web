name: Build Radar IA public pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Repair IA catalog
        run: python3 scripts/fix_catalog.py
      - name: Validate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path('index.html').read_text(encoding='utf-8')
          assert 'function renderCatalog(){' in s
          assert 'const cardFor=' in s
          assert 'cards[Object.keys(TOOLS).indexOf(id)]' not in s
          print('OK')
          PY
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix IA category cards [skip ci]"
          git push
