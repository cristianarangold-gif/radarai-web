name: Build Radar IA public pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Repair IA catalog
        run: python3 scripts/fix_catalog.py
      - name: Update public AI guide
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          # Remove the legacy block, supporting section or div wrappers.
          patterns = [
              r'<section\b(?:(?!</section>).)*(?:FASE\s*10\s*[·•-]\s*AUTORIDAD\s+Y\s+Y?DECISI[ÓO]N)(?:(?!</section>).)*?</section>',
              r'<div\b(?:(?!</div>).)*?(?:FASE\s*10\s*[·•-]\s*AUTORIDAD\s+Y\s+Y?DECISI[ÓO]N)(?:(?!</div>).)*?</div>',
          ]
          for pattern in patterns:
              s = re.sub(pattern, '', s, count=1, flags=re.I|re.S)
          s = re.sub(r'<section\b(?:(?!</section>).)*?Alternativas,\s*precios\s+y\s+cambios\s+de\s+las\s+herramientas\s+IA(?:(?!</section>).)*?</section>', '', s, count=1, flags=re.I|re.S)
          section = '''<section id="alternativas-precios-ia" class="radar-value-section" aria-labelledby="alternativas-precios-title">
          <style>.radar-value-section{margin:42px auto;padding:28px;max-width:1180px;border:1px solid var(--border,#2a3454);border-radius:22px;background:linear-gradient(145deg,rgba(34,45,78,.45),rgba(16,22,40,.72));text-align:left}.radar-value-section h2,.radar-value-section h3{margin-top:0;color:var(--text-primary,#f5f7fb)}.radar-value-section p,.radar-value-section li{color:var(--text-secondary,#b4bfd4);line-height:1.65}.value-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,245px),1fr));gap:16px;margin-top:22px}.value-card{padding:20px;border:1px solid var(--border,#2a3454);border-radius:16px;background:rgba(10,15,29,.42)}.value-table{width:100%;border-collapse:collapse;margin-top:20px;display:block;overflow-x:auto}.value-table th,.value-table td{border-bottom:1px solid var(--border,#2a3454);padding:12px;text-align:left;vertical-align:top}.value-note{padding:14px 16px;border-left:4px solid #7c9cff;background:rgba(124,156,255,.09);border-radius:8px}@media(max-width:600px){.radar-value-section{padding:20px;margin:28px 0}}</style>
          <h2 id="alternativas-precios-title">Alternativas, precios y cambios de las herramientas IA</h2>
          <p>Elegir una herramienta IA no consiste solo en escoger la más famosa. Compara utilidad, precio, límites, privacidad y cambios antes de pagar.</p>
          <div class="value-grid">
          <article class="value-card"><h3>1. Compara por tarea</h3><p>Una IA para redactar puede no ser la mejor para imágenes, programación, investigación o automatización.</p><ul><li>Define el resultado.</li><li>Prueba calidad y velocidad.</li><li>Comprueba integraciones.</li></ul></article>
          <article class="value-card"><h3>2. Calcula el precio real</h3><p>Revisa cuota, créditos, límites, consumo adicional, usuarios y funciones de cada plan.</p><ul><li>Gratis para probar.</li><li>Freemium con límites.</li><li>Suscripción periódica.</li><li>Pago por uso.</li></ul></article>
          <article class="value-card"><h3>3. Revisa los cambios</h3><p>Los modelos, funciones, límites, precios y condiciones pueden cambiar rápidamente.</p><ul><li>Consulta la web oficial.</li><li>Comprueba la fecha.</li><li>No presupongas que seguirá gratis.</li></ul></article>
          <article class="value-card"><h3>4. Protege tus datos</h3><p>Revisa retención, entrenamiento, privacidad y controles de administración antes de subir información.</p><ul><li>No compartas secretos.</li><li>Busca controles de privacidad.</li><li>Revisa contratos empresariales.</li></ul></article>
          </div>
          <h3>Qué revisar antes de elegir</h3><table class="value-table"><thead><tr><th>Criterio</th><th>Pregunta útil</th><th>Alerta</th></tr></thead><tbody><tr><td>Calidad</td><td>¿Resuelve mi caso?</td><td>Promesas sin pruebas.</td></tr><tr><td>Precio</td><td>¿Cuánto pagaré?</td><td>Límites ocultos.</td></tr><tr><td>Privacidad</td><td>¿Qué ocurre con mis datos?</td><td>Política confusa.</td></tr><tr><td>Continuidad</td><td>¿Tiene soporte?</td><td>Producto abandonado.</td></tr><tr><td>Portabilidad</td><td>¿Puedo exportar?</td><td>Dependencia total.</td></tr></tbody></table>
          <h3>Cómo encontrar una alternativa mejor</h3><p>Compara al menos tres opciones con la misma tarea y anota calidad, tiempo, límites y coste. Elige el mejor equilibrio para tu uso, no la herramienta con más publicidad.</p>
          <p class="value-note"><strong>Consejo Radar IA:</strong> verifica precio, moneda, impuestos, renovación, límites y cancelación en la web oficial. Las condiciones pueden cambiar.</p>
          <p>Consulta también nuestras <a href="/alternativas/index.html">alternativas de IA</a>, <a href="/precios/index.html">precios</a> y <a href="/revisiones/index.html">revisiones</a>.</p>
          </section>'''
          if 'id="alternativas-precios-ia"' not in s:
              s = s.replace('</body>', section + '\n</body>', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Validate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path('index.html').read_text(encoding='utf-8')
          assert '<!DOCTYPE html>' in s
          assert '</html>' in s
          assert 'function renderCatalog(){' in s
          assert 'const cardFor=' in s
          assert 'cards[Object.keys(TOOLS).indexOf(id)]' not in s
          assert 'FASE 10' not in s.upper()
          assert 'alternativas-precios-ia' in s
          assert 'Alternativas, precios y cambios de las herramientas IA' in s
          assert 'Qué revisar antes de elegir' in s
          print('OK: HTML completo y sección ampliada validada')
          PY
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish expanded AI alternatives guide [skip ci]"
          git push
