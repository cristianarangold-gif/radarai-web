name: Noticias candidatas

on:
  schedule:
    # 06:17 en Madrid (horario de verano), 05:17 en invierno. Fuera de la hora en punto, que GitHub retrasa más.
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Recoger candidatas
        run: python scripts/news_collect.py > candidatas.md
      - name: Crear issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -s candidatas.md ]; then echo "Sin candidatas hoy"; exit 0; fi
          TITLE="Noticias candidatas $(date -u +%Y-%m-%d)"
          # La rutina de redacción crea la issue ella misma si este workflow llega tarde: no la dupliques.
          if gh issue list --label noticias --state all --search "\"$TITLE\" in:title" --json title --jq '.[].title' | grep -qx "$TITLE"; then
            echo "La issue de hoy ya existe"; exit 0
          fi
          gh label create noticias --color FFB86B --description "Candidatas de noticias" 2>/dev/null || true
          gh issue create --title "$TITLE" --label noticias --body-file candidatas.md
